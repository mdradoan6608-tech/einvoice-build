# Runs in the public repo einvoice-build. The code arrives locked
# (payload.enc) and is opened here with the BUILD_KEY secret. All build
# output goes into build.log, which is locked again before it is shared,
# so the public log shows only step names.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Unlock the code
        env:
          BUILD_KEY: ${{ secrets.BUILD_KEY }}
        run: |
          printf '%s' "$BUILD_KEY" > "$RUNNER_TEMP/k"
          touch build.log
          mkdir src
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in payload.enc \
            -pass file:"$RUNNER_TEMP/k" | tar xz -C src
          echo "Unlocked"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      # Fixed Flutter version: the same code always builds the same way.
      # To move to a newer Flutter, change the number here on purpose.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Tests
        working-directory: src
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq libsqlite3-dev > /dev/null
          if ! flutter pub get >> ../build.log 2>&1; then echo "pub get failed"; exit 1; fi
          if ! flutter test >> ../build.log 2>&1; then echo "Tests failed"; exit 1; fi
          echo "Tests passed"

      - name: Prepare Android
        working-directory: src
        run: |
          {
            flutter create --platforms=android --org com.radoan --project-name einvoice_app .
            for f in android/app/build.gradle.kts android/app/build.gradle; do
              if [ -f "$f" ]; then
                sed -i 's/applicationId = "[^"]*"/applicationId = "com.radoan.einvoice"/; s/applicationId "[^"]*"/applicationId "com.radoan.einvoice"/' "$f"
              fi
            done
            sh tools/patch_android.sh
            flutter pub get
          } >> ../build.log 2>&1 || { echo "Prepare failed"; exit 1; }
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle << 'GRADLE'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.library')) {
                p.android.compileSdk = 36
              }
            }
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital')) {
                t.enabled = false
              }
            }
          }
          GRADLE
          echo "Ready"

      - name: Build APK
        working-directory: src
        run: |
          # The version shown in the app comes from pubspec.yaml.
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          if ! flutter build apk --release --no-shrink --dart-define=APP_VERSION=$V >> ../build.log 2>&1; then echo "APK build failed"; exit 1; fi
          echo "APK built"

      - name: Build AAB (only when asked)
        working-directory: src
        run: |
          if [ ! -f ../aab ]; then echo "Skipped"; exit 0; fi
          if ! flutter build appbundle --release --no-shrink --dart-define=APP_VERSION=$APP_VERSION >> ../build.log 2>&1; then echo "AAB build failed"; exit 1; fi
          echo "AAB built"

      - name: Sign
        working-directory: src
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../out
          {
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/unsigned.apk"
            $BT/zipalign -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            $BT/apksigner sign --ks "$RUNNER_TEMP/release.p12" --ks-type pkcs12 --ks-key-alias einvoice --ks-pass env:KSPASS --out ../out/einvoice-signed.apk "$RUNNER_TEMP/aligned.apk"
            $BT/apksigner verify ../out/einvoice-signed.apk
            if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
              cp build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/unsigned.aab"
              zip -q -d "$RUNNER_TEMP/unsigned.aab" 'META-INF/*' || true
              jarsigner -keystore "$RUNNER_TEMP/release.p12" -storetype pkcs12 -storepass "$KSPASS" -sigalg SHA256withRSA -digestalg SHA-256 -signedjar ../out/einvoice.aab "$RUNNER_TEMP/unsigned.aab" einvoice
              jarsigner -verify ../out/einvoice.aab
            fi
            # pubspec.lock records the exact package versions of this build.
            cp pubspec.lock ../out/pubspec.lock
          } >> ../build.log 2>&1 || { echo "Signing failed"; exit 1; }
          echo "Signed"

      - name: Lock the files
        run: |
          # The public release must not show the app files, so they are
          # locked with the same key as the code. build.sh apk opens them.
          cd out
          for f in *; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" \
              -out "$f.enc" -pass file:"$RUNNER_TEMP/k"
            rm -f "$f"
          done
          ls
          echo "Locked"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -R "$GITHUB_REPOSITORY" --cleanup-tag -y > /dev/null 2>&1 || true
          gh release create latest out/* -R "$GITHUB_REPOSITORY" --title "Latest build" --notes "Build ${{ github.run_number }}" > /dev/null
          echo "Published"

      - name: Share the locked log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || touch build.log
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in build.log \
            -out build.log.enc -pass file:"$RUNNER_TEMP/k"
          gh release delete log -R "$GITHUB_REPOSITORY" --cleanup-tag -y > /dev/null 2>&1 || true
          gh release create log build.log.enc -R "$GITHUB_REPOSITORY" --title "Locked log" --notes "Open with: sh tools/build.sh log" > /dev/null
          rm -f "$RUNNER_TEMP/k" "$RUNNER_TEMP/release.p12"
          echo "Log shared"
